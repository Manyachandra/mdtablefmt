[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdtablefmt"
version = "0.1.0"
description = "Detect, format, and normalize markdown tables in files."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mdtablefmt = "mdtablefmt:main"

[tool.setuptools]
py-modules = ["mdtablefmt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
